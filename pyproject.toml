[project]
name = "wadr"
version = "0.1.0"
description = "WhatsApp Document Retrieval - hybrid search over documents shared on WhatsApp (IR course project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "mcp>=2.1.1",
    "numpy>=1.26",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.30",
]

[project.scripts]
wadr = "wadr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is calls-in-defaults; B008 is a false
# positive on every route we have.
extend-immutable-calls = [
    "fastapi.Body", "fastapi.Cookie", "fastapi.Depends",
    "fastapi.Header", "fastapi.Path", "fastapi.Query",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
