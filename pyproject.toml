[project]
name = "wadr"
version = "0.1.0"
description = "WhatsApp Document Retrieval - hybrid search over documents shared on WhatsApp (IR course project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.30",
]

[project.scripts]
wadr = "wadr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
