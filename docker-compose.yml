services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wadr
      POSTGRES_PASSWORD: wadr
      POSTGRES_DB: wadr
    ports:
      # ponytail: host port 5433 - 5432 tends to be taken by other local Postgres instances
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wadr"]
      interval: 5s
      timeout: 2s
      retries: 10
    volumes:
      - wadr_pgdata:/var/lib/postgresql/data
      # schema lives in migrations/ - apply with: uv run wadr migrate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wadr -d wadr"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wadr_pgdata:
