services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wadr
      POSTGRES_PASSWORD: wadr
      POSTGRES_DB: wadr
    ports:
      # ponytail: host port 5433 - 5432 tends to be taken by other local Postgres instances
      - "5433:5432"
    volumes:
      - wadr_pgdata:/var/lib/postgresql/data
      # schema lives in migrations/ - apply with: uv run wadr migrate

volumes:
  wadr_pgdata:
